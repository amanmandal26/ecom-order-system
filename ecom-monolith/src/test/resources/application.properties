# Test Configuration - same MySQL database as dev (ecom_db)
# No separate database needed — uses the same credentials from application-dev.properties

spring.datasource.url=jdbc:mysql://localhost:3306/ecom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Aman@123

# JPA - update keeps existing tables and data safe, adds missing columns if any
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Run schema.sql so tables exist before tests run (CREATE TABLE IF NOT EXISTS is safe to re-run)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT (required for application context to start)
jwt.secret=ecom-super-secret-key-that-is-long-enough-for-hs256-algorithm
jwt.expiration=86400000
