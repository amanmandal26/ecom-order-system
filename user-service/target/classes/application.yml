server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/users_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:Aman@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:amankumar260899@gmail.com}
    password: ${MAIL_PASSWORD:nhvm zuyd crvi flya}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ecom-super-secret-key-that-is-long-enough-for-hs256-algorithm
  # Access token: 15 minutes (15 * 60 * 1000). Short-lived so a stolen token expires quickly.
  expiration: 900000
  # Refresh token: 30 days (30 * 24 * 60 * 60 * 1000). Long-lived but stored in DB so
  # it can be revoked server-side at any time (logout, password change, suspicious activity).
  refresh-expiration: 2592000000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    "[org.springframework.mail]": DEBUG
    "[com.sun.mail]": DEBUG
