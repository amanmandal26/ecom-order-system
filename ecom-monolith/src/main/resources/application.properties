# =====================================================
# E-Commerce Monolith Application Configuration
# =====================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.com.ecom.monolith=DEBUG

# =====================================================
# Database Configuration (Production Defaults)
# =====================================================
# Override these in application-dev.properties for local development
spring.datasource.url=jdbc:mysql://localhost:3306/ecom_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# =====================================================
# JWT Configuration
# =====================================================
# Secret: must be at least 256 bits for HS256 algorithm
# Expiration: 86400000 ms = 24 hours (configurable)
jwt.secret=ecom-super-secret-key-that-is-long-enough-for-hs256-algorithm
jwt.expiration=86400000

# =====================================================
# Jackson JSON Serialization
# =====================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# =====================================================
# Actuator (Optional: for monitoring)
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
